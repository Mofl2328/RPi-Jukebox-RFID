# Drop-in for the jukebox user service: reset the PN532 RFID reader before every start,
# so a reader left stuck by a crash or unclean shutdown comes up clean.
# See documentation/builders/pn532-reader-reset.md.
# Installed as ~/.config/systemd/user/jukebox-daemon.service.d/pn532-reset.conf
# (copy: resources/default-services/jukebox-daemon.service.d/pn532-reset.conf), then: systemctl --user daemon-reload
[Service]
ExecStartPre=/usr/local/bin/pn532-reset.sh
